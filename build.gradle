plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { kunjinkao { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { kunjinkao { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()
            mods { kunjinkao { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 编译期依赖：1.20.1 / Forge 版本，由 Modrinth 下载后放进 libs/（不进仓库）
    compileOnly files(
            'libs/appliedenergistics2-forge-15.4.11.jar',
            'libs/neoecoae-20.4.2.jar',
            // JEI 只是可选的配方预览集成；MixinExtras 是 demo 的 LevelPauseMixin 依赖
            // （NeoForge 内置 MixinExtras，Forge 1.20.1 不内置，必须自己带）。
            'libs/jei-1.20.1-forge-15.71.0.224.jar',
            'libs/mixinextras-forge-0.3.5.jar',
            // 上面那个是 jar-in-jar 包装，真类在这个内层 jar 里；编译期要它才看得到 @Local。
            'libs/mixinextras-0.3.5.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}
jar.finalizedBy('reobfJar')

// ---------------------------------------------------------------------------
// 部署到测试实例（与 1.21.1 工程同一套约定，两边行为对齐）
//
//   gradle build                          构建 + 自动部署
//   gradle build -PtestInstanceModsDir=.. 换目标目录
//
// 只删 kunjinkao*.jar —— 同目录下别人的模组一个都不碰。
// 目标目录不存在时只打一行日志跳过（换机器、或那个实例被删了）。
//
// 与 1.21.1 的差别：那边是 NeoForge，jar 就是成品；这边 ForgeGradle 要把类
// reobf 回混淆名才认得出来，所以必须等 reobfJar 跑完再复制 ——
// 否则复制出去的是开发名（net.minecraft.* 直呼）的 jar，进游戏会直接崩。
// ---------------------------------------------------------------------------
def testInstanceModsDir = providers.gradleProperty('testInstanceModsDir')
        .getOrElse('F:/mcc/mc/.minecraft/versions/KunJinKao 测试 1.20.1/mods')

tasks.register('deployToTestInstance') {
    group = 'build'
    description = '把 reobf 后的主 jar 复制到测试实例的 mods 目录，并删除其中的旧 kunjinkao 版本'
    dependsOn tasks.named('reobfJar')
    doNotTrackState('目标目录在工程之外，且可能含 Gradle 读不动的文件')

    def jarProvider = tasks.named('jar').flatMap { it.archiveFile }
    def targetDir = file(testInstanceModsDir)

    onlyIf { jarProvider.get().asFile.exists() }

    doLast {
        def jar = jarProvider.get().asFile
        if (!targetDir.exists()) {
            logger.lifecycle("[deploy] 目标目录不存在，跳过：${targetDir}")
            return
        }
        // 1) 删旧的 kunjinkao（保留本次要部署的同名文件，避免白删一遍）
        def stale = targetDir.listFiles({ f ->
            f.isFile() && f.name.startsWith('kunjinkao') && f.name.endsWith('.jar') && f.name != jar.name
        } as FileFilter)
        def undeleted = []
        (stale ?: new File[0]).sort { it.name }.each { old ->
            old.delete()
            if (old.exists()) {
                undeleted << old.name
            } else {
                logger.lifecycle("[deploy] 删除旧版 ${old.name}")
            }
        }
        if (undeleted) {
            throw new GradleException(
                    "[deploy] 删不掉旧版：${undeleted.join(', ')}。\n" +
                    "  最可能的原因：【游戏正开着】，它占用了这些 jar。\n" +
                    "  请先关掉游戏再构建 —— 否则 mods 目录里会同时存在两个同 ID 的模组，\n" +
                    "  下次启动会因为模组重复而直接失败。")
        }
        // 2) 复制
        java.nio.file.Files.copy(jar.toPath(), new File(targetDir, jar.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("[deploy] 已部署 ${jar.name} -> ${targetDir}")
        def now = targetDir.listFiles({ f ->
            f.isFile() && f.name.startsWith('kunjinkao') && f.name.endsWith('.jar')
        } as FileFilter)
        logger.lifecycle("[deploy] 该目录现有 kunjinkao：${(now ?: new File[0])*.name}")
    }
}

tasks.named('build').configure {
    finalizedBy 'deployToTestInstance'
}
